<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Reed &amp; Elin — Our Growing Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100dvh;overflow:hidden;
      position:fixed;inset:0;
      background:#fbf9f5;
      font-family:'Plus Jakarta Sans',sans-serif;
      -webkit-font-smoothing:antialiased;
      color:#2b261f;
    }

    /* ── Loading Screen ── */
    #loader{
      position:fixed;inset:0;background:#fbf9f5;z-index:999;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:opacity .8s ease,visibility .8s;
      padding:2rem;text-align:center;
    }
    #loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .lr{
      width:56px;height:56px;
      border:2.5px solid rgba(212,175,55,.25);
      border-top-color:#d4af37;
      border-radius:50%;
      position:relative;
      animation:sp 1.2s cubic-bezier(0.5,0.1,0.5,0.9) infinite;
      margin-bottom:1.8rem;
    }
    .lr::after{
      content:'💎';
      position:absolute;
      top:-13px;
      left:50%;
      transform:translateX(-50%);
      font-size:15px;
      filter:drop-shadow(0 0 5px rgba(212,175,55,.7));
    }
    @keyframes sp{to{transform:rotate(360deg)}}
    .ln{
      font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;
      letter-spacing:.12em;text-transform:uppercase;color:#28231a;margin-bottom:.35rem;
    }
    .ln span.amp{font-style:italic;color:#c5991e;font-size:2rem;margin:0 .25rem}
    .ls{font-size:.78rem;color:#7e7769;letter-spacing:.16em;text-transform:uppercase;margin-bottom:1.4rem}
    .lb{
      background:#28231a;color:#fff;border:none;padding:.72rem 2.2rem;border-radius:999px;
      font-size:.78rem;letter-spacing:.14em;cursor:pointer;display:none;
      box-shadow:0 4px 16px rgba(40,35,26,.15);
      animation:pb 2s infinite ease-in-out;
    }
    @keyframes pb{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

    /* ── Scene ── */
    .scene{position:fixed;inset:0;overflow:hidden}
    #svg{position:absolute;top:0;left:0;width:100%;height:100%}

    /* ── Audio Pill ── */
    .ap{
      position:absolute;top:clamp(.8rem,2.5vh,1.4rem);right:clamp(.8rem,3vw,1.8rem);z-index:30;
      background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border:1px solid rgba(212,175,55,.3);border-radius:999px;
      padding:.38rem .9rem;display:inline-flex;align-items:center;gap:.45rem;
      font-size:.7rem;letter-spacing:.09em;color:#4a4235;cursor:pointer;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
      transition:all .25s ease;
    }
    .ap:hover{background:rgba(255,255,255,.9);color:#1f1c16;border-color:rgba(212,175,55,.6)}
    .ap.on{color:#3d6b1f;border-color:rgba(61,107,31,.4)}
    .eb{display:flex;align-items:flex-end;gap:2px;height:10px}
    .eb span{width:2px;background:currentColor;border-radius:1px;height:2px}
    .ap.on .eb span:nth-child(1){animation:e1 .7s ease-in-out infinite alternate}
    .ap.on .eb span:nth-child(2){animation:e2 .5s ease-in-out infinite alternate .2s}
    .ap.on .eb span:nth-child(3){animation:e3 .8s ease-in-out infinite alternate .1s}
    @keyframes e1{0%{height:2px}100%{height:10px}}
    @keyframes e2{0%{height:3px}100%{height:8px}}
    @keyframes e3{0%{height:2px}100%{height:9px}}

    /* ── Top Sky Overlay (Title + Timer + Leaves Badge) ── */
    .top-overlay{
      position:absolute;top:clamp(.7rem,2.2vh,1.6rem);left:0;right:0;
      display:flex;flex-direction:column;align-items:center;text-align:center;
      z-index:20;pointer-events:none;padding:0 1rem;
    }
    .title-row{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1.7rem,4.4vw,2.7rem);
      font-weight:300;letter-spacing:.12em;text-transform:uppercase;
      line-height:1;color:#28231a;margin-bottom:.25rem;
    }
    .title-row span.amp{font-style:italic;color:#c5991e;font-size:.9em;margin:0 .25rem}
    .ceremony-sub{
      font-size:clamp(.62rem,1.2vw,.76rem);font-weight:600;
      letter-spacing:.22em;text-transform:uppercase;color:#7a7263;
      margin-bottom:clamp(.4rem,1.2vh,.75rem);
    }
    .cg{display:flex;align-items:baseline;justify-content:center;gap:clamp(.45rem,2.4vw,1.6rem)}
    .cc{display:flex;flex-direction:column;align-items:center}
    .cv{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1.6rem,4vw,2.6rem);font-weight:300;
      color:#252018;line-height:1;font-variant-numeric:tabular-nums;
      text-shadow:0 1px 3px rgba(255,255,255,.9);
    }
    .cl{
      font-size:clamp(.48rem,.85vw,.6rem);font-weight:600;
      letter-spacing:.22em;text-transform:uppercase;
      color:#827a6b;margin-top:.15rem;
    }
    .c-sep{
      font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,2.5vw,1.8rem);
      color:#d4af37;opacity:.65;user-select:none;
    }
    .leaf-badge{
      display:inline-flex;align-items:center;gap:.35rem;
      background:rgba(255,255,255,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border:1px solid rgba(212,175,55,.28);border-radius:999px;
      padding:.22rem .8rem;margin-top:clamp(.35rem,1vh,.65rem);
      font-size:clamp(.65rem,1.15vw,.76rem);font-weight:500;
      color:#3a5c22;letter-spacing:.04em;
      box-shadow:0 2px 8px rgba(0,0,0,.03);
    }

    /* ── Ring Sparkle Animation ── */
    @keyframes diamondGlint{
      0%,100%{opacity:.3;transform:scale(.8)}
      50%{opacity:1;transform:scale(1.2)}
    }
    .diamond-sparkle{
      animation:diamondGlint 3s ease-in-out infinite;
      transform-origin:800px 814px;
    }
    @keyframes ringAuraPulse{
      0%,100%{opacity:.75;transform:scale(1)}
      50%{opacity:1;transform:scale(1.06)}
    }
    .ring-aura{
      animation:ringAuraPulse 4s ease-in-out infinite;
      transform-origin:800px 870px;
    }

    @media(max-height:640px){
      .title-row{font-size:1.5rem}
      .ceremony-sub{font-size:.58rem;margin-bottom:.25rem}
      .cv{font-size:1.35rem}
      .cl{font-size:.45rem}
      .leaf-badge{font-size:.6rem;padding:.15rem .6rem;margin-top:.25rem}
    }
  </style>
</head>

  [798,292,830,266,3,0],[830,266,856,246,1.5,0],

  // Tier 1 (day 30)
  [668,498,645,518,2.5,1],[645,518,622,504,1.5,1],
  [942,438,962,458,2.2,1],[962,458,982,444,1.3,1],

  // Tier 2 (day 90)
  [712,532,690,550,3,2],[682,358,660,342,1.8,2],
  [898,472,920,490,2.5,2],[920,312,942,300,1.5,2],

  // Tier 3 (day 180)
  [748,288,730,270,1.8,3],[856,246,876,230,1.5,3],
  [622,504,605,490,1.3,3],[982,444,1000,430,1.2,3],

  // Tier 4 (day 365)
  [638,468,616,456,1.5,4],[972,408,992,396,1.3,4],
  [730,270,713,258,1.3,4],[876,230,894,218,1.2,4],

  // Tier 5 (day 730)
  [660,342,640,330,1.3,5],[942,300,960,288,1.2,5],
  [605,490,588,478,1.1,5],[1000,430,1016,418,1,5],

  // Tier 6 (day 1825, ~5yr)
  [616,456,598,444,1.2,6],[992,396,1010,385,1.1,6],
  [713,258,698,248,1.1,6],[894,218,910,208,1,6],

  // Tier 7 (day 3650, ~10yr)
  [640,330,622,320,1.1,7],[960,288,976,278,1,7],
  [588,478,572,468,1,7],[1016,418,1030,408,.9,7]
];

const TD=[0,30,90,180,365,730,1825,3650];
const TE=11; // trunk ends at index 11

const GRN=['#3e6f21','#4e842e','#61973f','#519133','#72a753','#3c6a23','#5c923b','#77b04d','#4d8b2a','#63a044'];

const bL=document.getElementById('bL');
const fL=document.getElementById('fL');
const gL=document.getElementById('gL');

let nLeaves=0, drawnB=new Set();

/* ── Elapsed Calculator ── */
function elapsed(){
  const d=Date.now()-W;
  if(d<0)return{d:0,h:0,m:0,s:0,td:0};
  return{d:Math.floor(d/864e5),h:Math.floor(d%864e5/36e5),m:Math.floor(d%36e5/6e4),s:Math.floor(d%6e4/1e3),td:Math.floor(d/864e5)};
}

function curTier(days){for(let i=TD.length-1;i>=0;i--)if(days>=TD[i])return i;return 0}

/* ── Draw Branch ── */
function drawB(i){
  if(drawnB.has(i))return;drawnB.add(i);
  const b=B[i],s=i%2===0?1:-1;
  const mx=(b[0]+b[2])/2+(b[1]-b[3])*.12*s;
  const my=(b[1]+b[3])/2+(b[0]-b[2])*.12*s;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',`M${b[0]} ${b[1]}Q${mx.toFixed(1)} ${my.toFixed(1)} ${b[2]} ${b[3]}`);
  const ci=i%3;
  p.setAttribute('stroke',ci===0?'#483522':ci===1?'#56412f':'#634f3c');
  p.setAttribute('stroke-width',b[4]);
  p.setAttribute('fill','none');
  p.setAttribute('stroke-linecap','round');
  bL.appendChild(p);
}

/* ── Update Branches ── */
function updateB(days){
  const t=curTier(days);
  for(let i=TE;i<B.length;i++)if(B[i][5]<=t)drawB(i);
}

/* ── Leaf Renderer ── */
function mkLeaf(day){
  const t=curTier(day);
  const avail=[];
  for(let i=TE;i<B.length;i++)if(B[i][5]<=t)avail.push(B[i]);
  if(!avail.length)avail.push(B[TE]);

  const r=m32(day*2654435761+12345);
  const br=avail[Math.floor(r()*avail.length)];
  const pos=.15+r()*.7;
  let x=br[0]+(br[2]-br[0])*pos;
  let y=br[1]+(br[3]-br[1])*pos;

  // Canopy spread increases with time
  const sp=Math.min(day/400,6);
  x+=(r()-.5)*sp*14;
  y+=(r()-.5)*sp*10;

  const ang=r()*360;
  const sc=.55+r()*.5;
  const ty=day%3;
  const c=[GRN[Math.floor(r()*10)],GRN[Math.floor(r()*10)],GRN[Math.floor(r()*10)]];

  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})rotate(${ang.toFixed(0)})scale(${sc.toFixed(2)})`);

  const L=13;
  if(ty===0){
    // Single leaf
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M0 0C-3.2 -${(L*.3).toFixed(1)} -4.2 -${(L*.65).toFixed(1)} 0 -${L}C4.2 -${(L*.65).toFixed(1)} 3.2 -${(L*.3).toFixed(1)} 0 0`);
    p.setAttribute('fill',c[0]);g.appendChild(p);
  }else if(ty===1){
    // Pair
    const p1=document.createElementNS(NS,'path');
    p1.setAttribute('d',`M0 0C-4.5 -2 -7.5 -${(L*.5).toFixed(1)} -4.5 -${(L*.82).toFixed(1)}C-1.2 -${(L*.55).toFixed(1)} -.5 -${(L*.15).toFixed(1)} 0 0`);
    p1.setAttribute('fill',c[0]);g.appendChild(p1);
    const p2=document.createElementNS(NS,'path');
    p2.setAttribute('d',`M0 0C4.5 -2 7.5 -${(L*.5).toFixed(1)} 4.5 -${(L*.82).toFixed(1)}C1.2 -${(L*.55).toFixed(1)} .5 -${(L*.15).toFixed(1)} 0 0`);
    p2.setAttribute('fill',c[1]);g.appendChild(p2);
  }else{
    // Trio
    const p1=document.createElementNS(NS,'path');
    p1.setAttribute('d',`M0 0C-4.2 -1.2 -6.5 -${(L*.42).toFixed(1)} -4 -${(L*.72).toFixed(1)}C-1 -${(L*.48).toFixed(1)} -.4 -${(L*.12).toFixed(1)} 0 0`);
    p1.setAttribute('fill',c[0]);g.appendChild(p1);
    const p2=document.createElementNS(NS,'path');
    p2.setAttribute('d',`M0 0C-1.6 -${(L*.28).toFixed(1)} -1.6 -${(L*.62).toFixed(1)} 0 -${(L*.92).toFixed(1)}C1.6 -${(L*.62).toFixed(1)} 1.6 -${(L*.28).toFixed(1)} 0 0`);
    p2.setAttribute('fill',c[1]);g.appendChild(p2);
    const p3=document.createElementNS(NS,'path');
    p3.setAttribute('d',`M0 0C4.2 -1.2 6.5 -${(L*.42).toFixed(1)} 4 -${(L*.72).toFixed(1)}C1 -${(L*.48).toFixed(1)} .4 -${(L*.12).toFixed(1)} 0 0`);
    p3.setAttribute('fill',c[2]);g.appendChild(p3);
  }
  return g;
}

function updateLeaves(n){
  while(nLeaves<n){nLeaves++;fL.appendChild(mkLeaf(nLeaves))}
}

/* ── Grass Generation (Sunlit winter noon palette) ── */
function genGrass(){
  const r=m32(42);let h='';
  for(let i=0;i<550;i++){
    const x=(i/550)*1800-100+(r()-.5)*4;
    const ht=3+r()*30;
    const cv=(r()-.5)*14;
    const gr=75+r()*105,rd=40+r()*50,bl=15+r()*25;
    const w=.6+r()*1.4;
    h+=`<path d="M${x.toFixed(1)} 750Q${(x+cv).toFixed(1)} ${(750-ht*.5).toFixed(1)} ${(x+cv*.6).toFixed(1)} ${(750-ht).toFixed(1)}" stroke="rgb(${rd|0},${gr|0},${bl|0})" stroke-width="${w.toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  // Wildflower seed accents (snowdrops, buttercups, soft petals)
  for(let i=0;i<45;i++){
    const x=r()*1800-100,y=750-5-r()*20;
    const cls=['#fff9e6','#fae2e2','#d8edf8','#f6deec','#e0f0d2','#faeedc'];
    h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.7+r()*1.3).toFixed(1)}" fill="${cls[r()*6|0]}" opacity="${(.45+r()*.5).toFixed(2)}"/>`;
  }
  gL.innerHTML=h;
}

/* ── Counter Update ── */
function tick(){
  const e=elapsed();
  document.getElementById('vd').textContent=String(e.d).padStart(2,'0');
  document.getElementById('vh').textContent=String(e.h).padStart(2,'0');
  document.getElementById('vm').textContent=String(e.m).padStart(2,'0');
  document.getElementById('vs').textContent=String(e.s).padStart(2,'0');
  document.getElementById('gb').textContent=
    `🌿 ${e.td} Lea${e.td!==1?'ves':'f'} Bloomed (Day ${e.td}) · Tree ${e.td>0?'Growing':'Planted'}`;
  updateB(e.td);
  updateLeaves(e.td);
}

/* ── Audio System ── */
function initAudio(){
  const au=document.getElementById('au');
  const btn=document.getElementById('ab');
  const lbl=document.getElementById('al');
  const ld=document.getElementById('loader');
  const ls=document.getElementById('lst');
  const lb=document.getElementById('lbtn');
  let playing=false;

  function play(){au.play().then(()=>{playing=true;btn.classList.add('on');lbl.textContent='Pause'}).catch(()=>{})}
  function pause(){au.pause();playing=false;btn.classList.remove('on');lbl.textContent='Play'}
  btn.addEventListener('click',()=>playing?pause():play());

  let ready=false;
  function onReady(){
    if(ready)return;ready=true;
    ls.textContent='Ready';lb.style.display='inline-block';
    au.play().then(()=>{playing=true;btn.classList.add('on');lbl.textContent='Pause';hide()}).catch(()=>{lb.style.display='inline-block'});
  }
  function hide(){ld.classList.add('hidden');setTimeout(()=>ld.remove(),800)}
  function enter(){play();hide()}

  lb.addEventListener('click',enter);
  ld.addEventListener('click',e=>{if(ready)enter()});
  au.addEventListener('canplaythrough',onReady);
  au.addEventListener('loadeddata',onReady);
  au.addEventListener('error',onReady);
  setTimeout(onReady,2500);
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded',function(){
  genGrass();
  tick();
  setInterval(tick,1000);
  initAudio();
});
})();
</script>
