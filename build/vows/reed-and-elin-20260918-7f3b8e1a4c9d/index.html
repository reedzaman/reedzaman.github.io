<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reed & Elin — Forever</title>
  
  <!-- Minimalist Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #faf8f5;
      --card-bg: #ffffff;
      --text-main: #1b1920;
      --text-muted: #797587;
      --line-color: #e5e0d5;
      --line-active: #c59a42;
      --gold-accent: #c59a42;
      --gold-soft: #f3ebd6;
      --border-soft: rgba(0, 0, 0, 0.06);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden; /* Strictly no scroll */
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       LOADING SCREEN
       ============================================================ */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-color);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 58px;
      height: 58px;
      border: 2px solid var(--gold-soft);
      border-top-color: var(--gold-accent);
      border-radius: 50%;
      animation: spinRing 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      margin-bottom: 1.8rem;
      position: relative;
    }

    .loader-ring::after {
      content: '💎';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-names {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      letter-spacing: 0.12em;
      font-weight: 300;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    .loader-status {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .loader-enter-btn {
      background: var(--text-main);
      color: #ffffff;
      border: none;
      padding: 0.75rem 2.2rem;
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      animation: pulseBtn 2s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .loader-enter-btn:hover {
      background: #000000;
      transform: translateY(-2px);
    }

    /* ============================================================
       PAGE CONTAINER (TIGHTLY CENTERED, FULL HEIGHT, NO SCROLL)
       ============================================================ */
    .page-layout {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Intimately clustered at the center */
      align-items: center;
      padding: 1.25rem 1.25rem 1.25rem;
      max-width: 820px;
      margin: 0 auto;
      position: relative;
    }

    /* Top Floating Controls */
    .top-bar {
      position: absolute;
      top: clamp(1rem, 2.5vh, 1.8rem);
      left: clamp(1rem, 3vw, 2rem);
      right: clamp(1rem, 3vw, 2rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .date-pill {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .audio-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 9999px;
      padding: 0.4rem 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: all 0.25s ease;
    }

    .audio-btn:hover {
      color: var(--text-main);
      border-color: rgba(0, 0, 0, 0.15);
    }

    .audio-btn.playing {
      color: var(--gold-accent);
      border-color: var(--gold-soft);
    }

    /* Equalizer Bars */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      width: 10px;
    }

    .eq-bar {
      width: 2px;
      background: currentColor;
      border-radius: 1px;
      height: 2px;
      transition: height 0.2s ease;
    }

    .audio-btn.playing .eq-bar:nth-child(1) { animation: eq1 0.7s ease-in-out infinite alternate; }
    .audio-btn.playing .eq-bar:nth-child(2) { animation: eq2 0.5s ease-in-out infinite alternate 0.2s; }
    .audio-btn.playing .eq-bar:nth-child(3) { animation: eq3 0.8s ease-in-out infinite alternate 0.1s; }

    @keyframes eq1 { 0% { height: 2px; } 100% { height: 10px; } }
    @keyframes eq2 { 0% { height: 3px; } 100% { height: 8px; } }
    @keyframes eq3 { 0% { height: 2px; } 100% { height: 9px; } }

    /* ============================================================
       CENTERED CONTENT CLUSTER
       ============================================================ */
    .center-cluster {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.75rem, 2vh, 1.4rem);
    }

    /* Header Section (Brought down close to the timeline) */
    .header-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .names-title {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 6.5vw, 4.2rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .names-title span.amp {
      font-style: italic;
      text-transform: lowercase;
      color: var(--gold-accent);
      margin: 0 0.35rem;
    }

    .ceremony-subtext {
      font-size: clamp(0.82rem, 2vw, 0.95rem);
      color: var(--text-muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ============================================================
       ULTRA ZOOMED-IN TIMELINE (Hero Centerpiece)
       viewBox="0 0 540 190" makes everything 2-3x larger!
       ============================================================ */
    .timeline-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .timeline-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      display: block;
    }

    /* Straight Line Styles */
    .track-line-base {
      stroke: var(--line-color);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .track-line-active {
      stroke: var(--line-active);
      stroke-width: 3;
      stroke-linecap: round;
    }

    /* Characters & Motion */
    .character-node {
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .char-name {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      fill: var(--text-main);
      text-anchor: middle;
      text-transform: uppercase;
    }

    .char-status {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 13px;
      fill: var(--text-muted);
      text-anchor: middle;
    }

    /* Central Ring */
    .ring-center {
      transform-origin: 270px 95px;
      animation: ringBreath 4s ease-in-out infinite alternate;
    }

    @keyframes ringBreath {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .ring-sparkle {
      animation: diamondGlint 2.5s ease-in-out infinite;
      transform-origin: 270px 65px;
    }

    @keyframes diamondGlint {
      0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(45deg); filter: drop-shadow(0 0 8px rgba(197, 154, 66, 0.9)); }
    }

    /* ============================================================
       COUNTDOWN SECTION (Brought Closer to Center)
       ============================================================ */
    .countdown-section {
      width: 100%;
      max-width: 580px;
    }

    .countdown-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.4rem, 1.2vw, 0.75rem);
      text-align: center;
    }

    .countdown-unit {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: clamp(0.7rem, 2vh, 1.15rem) 0.3rem clamp(0.55rem, 1.5vh, 0.85rem);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: transform 0.25s ease;
    }

    .countdown-number {
      font-family: var(--font-serif);
      font-size: clamp(2.1rem, 5.5vw, 3.2rem);
      font-weight: 300;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 0.25rem;
      font-variant-numeric: tabular-nums;
    }

    .countdown-tag {
      font-size: clamp(0.6rem, 1.2vw, 0.7rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Footer Quote */
    .footer-quote {
      text-align: center;
    }

    .quote-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       LOADING SCREEN
       ============================================================ -->
  <div id="loadingScreen">
    <div class="loader-ring"></div>
    <div class="loader-names">Reed &amp; Elin</div>
    <div id="loaderStatus" class="loader-status">Loading ...</div>
    <button id="loaderEnterBtn" class="loader-enter-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </button>
  </div>

  <!-- ============================================================
       MAIN PAGE (Intimately Centered, 100dvh, No Scroll)
       ============================================================ -->
  <div class="page-layout">
    
    <!-- Floating Top Bar -->
    <header class="top-bar">
      <div class="date-pill">September 18, 2026</div>
      <button id="audioBtn" class="audio-btn" aria-label="Toggle Audio">
        <span class="eq-bars">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </span>
        <span id="audioLabel">Play</span>
      </button>
    </header>

    <!-- Centered Content Cluster -->
    <div class="center-cluster">

      <!-- Header (Reed & Elin, KG 04:00 PM) -->
      <div class="header-section">
        <h1 class="names-title">
          Reed <span class="amp">&amp;</span> Elin
        </h1>
        <p class="ceremony-subtext">KG · 04:00 PM</p>
      </div>

      <!-- ============================================================
           ULTRA ZOOMED-IN STRAIGHT TIMELINE HERO
           viewBox="0 0 540 190"
           Center at (270, 95)
           ============================================================ -->
      <main class="timeline-container" aria-label="Timeline to marriage">
        <svg class="timeline-svg" viewBox="0 0 540 190" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Ring Shading -->
            <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fdf4d4" />
              <stop offset="45%" stop-color="#d4af37" />
              <stop offset="100%" stop-color="#9a7b1c" />
            </linearGradient>

            <!-- Reed Active Gradient -->
            <linearGradient id="reedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#e5e0d5" />
              <stop offset="100%" stop-color="#c59a42" />
            </linearGradient>

            <!-- Elin Active Gradient -->
            <linearGradient id="elinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#c59a42" />
              <stop offset="100%" stop-color="#e5e0d5" />
            </linearGradient>

            <!-- Drop shadow for figures -->
            <filter id="figureShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
            </filter>
          </defs>

          <!-- Base Straight Line Track (Y=95) -->
          <line x1="30" y1="95" x2="510" y2="95" class="track-line-base" />

          <!-- Active Progress Line Left (Reed to Ring) -->
          <line id="activeLineLeft" x1="30" y1="95" x2="90" y2="95" class="track-line-active" stroke="url(#reedGrad)" />

          <!-- Active Progress Line Right (Elin to Ring) -->
          <line id="activeLineRight" x1="450" y1="95" x2="510" y2="95" class="track-line-active" stroke="url(#elinGrad)" />

          <!-- ============================================================
               CENTER: GIANT WEDDING RING WITH SOLITAIRE DIAMOND
               Center at (270, 95)
               ============================================================ -->
          <g class="ring-center" id="ringCenter">
            <!-- Aura Circle -->
            <circle cx="270" cy="95" r="36" fill="#ffffff" stroke="rgba(197, 154, 66, 0.22)" stroke-width="1.5" />
            
            <!-- Outer Gold Band -->
            <circle cx="270" cy="95" r="23" fill="none" stroke="url(#ringGold)" stroke-width="5" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.12))" />
            <!-- Inner Gold Band Highlight -->
            <circle cx="270" cy="95" r="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9" />

            <!-- Diamond Setting Mount -->
            <polygon points="263,73 270,65 277,73" fill="#d4af37" />
            <line x1="261" y1="71" x2="279" y2="71" stroke="#fdf4d4" stroke-width="2" stroke-linecap="round" />

            <!-- Solitaire Diamond (Crisp & Refractive) -->
            <polygon points="270,55 282,68 277,75 263,75 258,68" fill="#ffffff" stroke="#c59a42" stroke-width="1.2" />
            <line x1="258" y1="68" x2="282" y2="68" stroke="#e0f2fe" stroke-width="1" />
            <line x1="270" y1="55" x2="270" y2="75" stroke="#e0f2fe" stroke-width="1" />
            <line x1="264" y1="68" x2="263" y2="75" stroke="#bae6fd" stroke-width="0.8" />
            <line x1="276" y1="68" x2="277" y2="75" stroke="#bae6fd" stroke-width="0.8" />

            <!-- Diamond Sparkle Glint -->
            <g class="ring-sparkle">
              <line x1="270" y1="43" x2="270" y2="57" stroke="#c59a42" stroke-width="1.5" stroke-linecap="round" />
              <line x1="263" y1="50" x2="277" y2="50" stroke="#c59a42" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="270" cy="50" r="2" fill="#ffffff" />
            </g>

            <text x="270" y="137" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="0.25em" fill="#c59a42" text-anchor="middle" font-weight="700">SEPT 18</text>
          </g>

          <!-- ============================================================
               LEFT: REED (BOY) — ULTRA ZOOMED IN (~95px height)
               ============================================================ -->
          <g id="reedNode" class="character-node" transform="translate(100, 0)" filter="url(#figureShadow)">
            <!-- Ground Shadow along straight line -->
            <ellipse cx="0" cy="95" rx="18" ry="4" fill="rgba(0, 0, 0, 0.12)" />

            <!-- Reed Figure -->
            <g transform="translate(-18, 5)">
              <!-- Head -->
              <circle cx="18" cy="15" r="10" fill="#1b1920" />
              <!-- Styled Hair -->
              <path d="M 9 15 Q 14 4 23 6 Q 28 8 28 15 Q 21 8 13 10 Z" fill="#383440" />

              <!-- Neck & Collar -->
              <path d="M 14 24 L 22 24 L 21 30 L 15 30 Z" fill="#1b1920" />
              <!-- Bowtie -->
              <polygon points="15,29 18,31 21,29 21,32 18,30 15,32" fill="#c59a42" />

              <!-- Suit Jacket / Body -->
              <path d="M 9 31 C 9 29, 27 29, 27 31 L 29 65 C 29 67, 7 67, 7 65 Z" fill="#1b1920" />

              <!-- Left Arm (trailing behind) -->
              <path d="M 10 33 L 2 57" stroke="#1b1920" stroke-width="5" stroke-linecap="round" />

              <!-- Right Arm (reaching forward towards ring holding flower) -->
              <path d="M 26 33 L 37 53 L 44 50" stroke="#1b1920" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
              <!-- Golden rose in hand -->
              <circle cx="45" cy="49" r="3.5" fill="#c59a42" />

              <!-- Legs walking forward along straight line -->
              <path d="M 12 65 L 9 92 L 15 94" stroke="#1b1920" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M 24 65 L 30 92 L 37 94" stroke="#1b1920" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <!-- Name & Distance Labels -->
            <text x="0" y="-8" class="char-name">REED</text>
            <text id="reedStatus" x="0" y="118" class="char-status">Walking to you</text>
          </g>

          <!-- ============================================================
               RIGHT: ELIN (GIRL) — ULTRA ZOOMED IN (~95px height)
               ============================================================ -->
          <g id="elinNode" class="character-node" transform="translate(440, 0)" filter="url(#figureShadow)">
            <!-- Ground Shadow along straight line -->
            <ellipse cx="0" cy="95" rx="18" ry="4" fill="rgba(0, 0, 0, 0.12)" />

            <!-- Elin Figure -->
            <g transform="translate(-18, 5)">
              <!-- Head -->
              <circle cx="18" cy="15" r="9.5" fill="#1b1920" />
              
              <!-- Long Cascading Hair -->
              <path d="M 16 8 Q 29 11 30 26 Q 31 42 25 53 Q 21 40 21 22 Z" fill="#383440" />
              <!-- Wedding Veil -->
              <path d="M 15 8 Q 34 17 36 55 Q 28 40 20 18 Z" fill="rgba(197, 154, 66, 0.28)" />

              <!-- Neck -->
              <path d="M 15 24 L 21 24 L 20 29 L 16 29 Z" fill="#1b1920" />

              <!-- Wedding Gown Bodice -->
              <path d="M 11 29 C 11 27, 25 27, 25 29 L 24 49 L 12 49 Z" fill="#1b1920" />

              <!-- Elegant Wedding Gown Skirt -->
              <path d="M 12 49 Q 2 73 0 94 L 33 94 Q 29 73 24 49 Z" fill="#1b1920" />
              <!-- Gown Crease Highlights -->
              <path d="M 17 50 Q 13 73 11 94" stroke="#ffffff" stroke-width="1.4" opacity="0.3" />
              <path d="M 19 50 Q 23 73 25 94" stroke="#ffffff" stroke-width="1.4" opacity="0.3" />

              <!-- Left Arm (reaching forward toward the ring) -->
              <path d="M 12 33 L -3 51 L -9 49" stroke="#1b1920" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
              <!-- Bouquet in hand -->
              <circle cx="-10" cy="48" r="3.5" fill="#e898a5" />

              <!-- Right Arm (graceful side) -->
              <path d="M 23 33 L 28 53" stroke="#1b1920" stroke-width="4.5" stroke-linecap="round" />
            </g>

            <!-- Name & Distance Labels -->
            <text x="0" y="-8" class="char-name">ELIN</text>
            <text id="elinStatus" x="0" y="118" class="char-status">Walking to you</text>
          </g>
        </svg>
      </main>

      <!-- ============================================================
           COUNTDOWN CARDS (Brought Close to Center)
           ============================================================ -->
      <section class="countdown-section">
        <div class="countdown-row">
          <div class="countdown-unit">
            <div id="days" class="countdown-number">00</div>
            <div class="countdown-tag">DAYS</div>
          </div>
          <div class="countdown-unit">
            <div id="hours" class="countdown-number">00</div>
            <div class="countdown-tag">HOURS</div>
          </div>
          <div class="countdown-unit">
            <div id="minutes" class="countdown-number">00</div>
            <div class="countdown-tag">MINUTES</div>
          </div>
          <div class="countdown-unit">
            <div id="seconds" class="countdown-number">00</div>
            <div class="countdown-tag">SECONDS</div>
          </div>
        </div>
      </section>

      <!-- Intimate Footer Quote -->
      <footer class="footer-quote">
        <p class="quote-text">
          "Every second brings me closer to you."
        </p>
      </footer>

    </div>

  </div>

  <!-- Background Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg" />
  </audio>

  <script>
    (function () {
      'use strict';

      // TARGET: September 18, 2026 at 4:00 PM (GMT+6)
      const TARGET_TIME = new Date("2026-09-18T16:00:00+06:00").getTime();
      const START_TIME = new Date("2026-01-01T00:00:00+06:00").getTime();
      const TOTAL_SPAN = TARGET_TIME - START_TIME;

      // Coordinate boundaries along the straight X-axis line (Y=95)
      // Viewbox is 540 wide: Ring is at X=270
      // Reed start: X=70, meeting point: X=220
      // Elin start: X=470, meeting point: X=320
      const REED_START_X = 70;
      const REED_END_X = 220;
      const ELIN_START_X = 470;
      const ELIN_END_X = 320;

      const elDays = document.getElementById('days');
      const elHours = document.getElementById('hours');
      const elMinutes = document.getElementById('minutes');
      const elSeconds = document.getElementById('seconds');
      const reedNode = document.getElementById('reedNode');
      const elinNode = document.getElementById('elinNode');
      const activeLineLeft = document.getElementById('activeLineLeft');
      const activeLineRight = document.getElementById('activeLineRight');
      const reedStatus = document.getElementById('reedStatus');
      const elinStatus = document.getElementById('elinStatus');

      function updateCountdown() {
        const now = Date.now();
        const diff = TARGET_TIME - now;

        if (diff <= 0) {
          elDays.textContent = "00";
          elHours.textContent = "00";
          elMinutes.textContent = "00";
          elSeconds.textContent = "00";
          setPositions(1);
          reedStatus.textContent = "Joined at the ring ❤️";
          elinStatus.textContent = "Joined at the ring ❤️";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        elDays.textContent = String(days).padStart(2, '0');
        elHours.textContent = String(hours).padStart(2, '0');
        elMinutes.textContent = String(minutes).padStart(2, '0');
        elSeconds.textContent = String(seconds).padStart(2, '0');

        // Linear progression along the straight timeline
        const elapsed = now - START_TIME;
        const progress = Math.max(0.06, Math.min(0.96, elapsed / TOTAL_SPAN));
        setPositions(progress);

        reedStatus.textContent = `${days}d ${hours}h left`;
        elinStatus.textContent = `${days}d ${hours}h left`;
      }

      function setPositions(progress) {
        const reedX = REED_START_X + (REED_END_X - REED_START_X) * progress;
        const elinX = ELIN_START_X - (ELIN_START_X - ELIN_END_X) * progress;

        reedNode.setAttribute('transform', `translate(${reedX}, 0)`);
        elinNode.setAttribute('transform', `translate(${elinX}, 0)`);

        activeLineLeft.setAttribute('x2', reedX);
        activeLineRight.setAttribute('x1', elinX);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      // ============================================================
      // AUDIO SYSTEM WITH LOADING SCREEN INTEGRATION
      // ============================================================
      const bgAudio = document.getElementById('bgMusic');
      const audioBtn = document.getElementById('audioBtn');
      const audioLabel = document.getElementById('audioLabel');
      const loadingScreen = document.getElementById('loadingScreen');
      const loaderStatus = document.getElementById('loaderStatus');
      const loaderEnterBtn = document.getElementById('loaderEnterBtn');

      let isPlaying = false;
      let synthContext = null;
      let synthInterval = null;
      let isUsingSynth = false;

      // Gentle piano chords synthesizer fallback if music.mp3 is not placed yet
      const notes = [261.63, 329.63, 392.00, 440.00, 523.25, 659.25];
      function playChime() {
        if (!synthContext || synthContext.state !== 'running') return;
        const osc = synthContext.createOscillator();
        const gain = synthContext.createGain();
        const note = notes[Math.floor(Math.random() * notes.length)];
        osc.type = 'sine';
        osc.frequency.setValueAtTime(note, synthContext.currentTime);

        const now = synthContext.currentTime;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.05, now + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

        osc.connect(gain);
        gain.connect(synthContext.destination);
        osc.start(now);
        osc.stop(now + 2.6);
      }

      function playAudio() {
        bgAudio.play().then(() => {
          isPlaying = true;
          isUsingSynth = false;
          audioBtn.classList.add('playing');
          audioLabel.textContent = "Pause";
        }).catch(() => {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!synthContext) synthContext = new AudioCtx();
            synthContext.resume().then(() => {
              isPlaying = true;
              isUsingSynth = true;
              audioBtn.classList.add('playing');
              audioLabel.textContent = "Pause";
              playChime();
              if (!synthInterval) {
                synthInterval = setInterval(playChime, 1800);
              }
            });
          } catch (e) {
            console.log("Audio not supported", e);
          }
        });
      }

      function pauseAudio() {
        isPlaying = false;
        audioBtn.classList.remove('playing');
        audioLabel.textContent = "Play";
        bgAudio.pause();
        if (synthInterval) {
          clearInterval(synthInterval);
          synthInterval = null;
        }
        if (synthContext && synthContext.state === 'running') {
          synthContext.suspend();
        }
      }

      function toggleAudio() {
        if (isPlaying) {
          pauseAudio();
        } else {
          playAudio();
        }
      }
      audioBtn.addEventListener('click', toggleAudio);

      // ============================================================
      // LOADING SCREEN LOGIC
      // ============================================================
      let audioReady = false;

      function onAudioReady() {
        if (audioReady) return;
        audioReady = true;
        loaderStatus.textContent = "Ready for you";
        loaderEnterBtn.style.display = "inline-flex";

        bgAudio.play().then(() => {
          isPlaying = true;
          audioBtn.classList.add('playing');
          audioLabel.textContent = "Pause";
          hideLoader();
        }).catch(() => {
          loaderEnterBtn.style.display = "inline-flex";
        });
      }

      function hideLoader() {
        loadingScreen.classList.add('hidden');
        setTimeout(() => {
          loadingScreen.remove();
        }, 900);
      }

      function enterSite() {
        playAudio();
        hideLoader();
      }

      loaderEnterBtn.addEventListener('click', enterSite);
      loadingScreen.addEventListener('click', (e) => {
        if (audioReady) enterSite();
      });

      bgAudio.addEventListener('canplaythrough', onAudioReady);
      bgAudio.addEventListener('loadeddata', onAudioReady);
      bgAudio.addEventListener('error', () => {
        onAudioReady();
      });

      setTimeout(onAudioReady, 2500);

    })();
  </script>
</body>
</html>
